# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.101

## Mod Properties
mod_id=gamebox
# note: Java properties are ISO-8859-1; use \uXXXX escapes for Chinese here
mod_name=\u6e38\u620f\u76d2\u5b50 (Game Box)
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.gamebox

# Gradle via local proxy (FlClash 17890)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=17890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=17890
systemProp.http.nonProxyHosts=localhost|127.0.0.1
